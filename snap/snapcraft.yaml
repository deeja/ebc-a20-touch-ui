name: battery-tester-kiosk
base: core22
version: "1.0"
summary: Touchscreen UI for the ZKETECH EBC-A20 battery tester
description: |
  A touchscreen kiosk app for the ZKETECH EBC-A20 battery capacity tester.
  Runs in fullscreen/no-cursor kiosk mode by default. See
  https://github.com/deeja/batterytesterui for details, screenshots, and
  usage.
grade: stable
confinement: strict

apps:
  battery-tester-kiosk:
    command: usr/bin/python3 $SNAP/main.py
    # Not `extensions: [gnome]` - on core22 that extension is documented to
    # rewrite/break the python3 symlinks it doesn't itself own (see
    # "Core22 gnome extension and broken symlinks" on the snapcraft forum),
    # which took out this app's own staged python3 and made `snapcraft
    # pack` fail with "snap is unusable due to missing files". Plain
    # desktop plugs - the fix that already worked for other people's
    # Tkinter-in-a-snap reports before anyone reached for the extension -
    # sidesteps that whole failure mode.
    plugs:
      - serial-port
      - home
      - x11
      - desktop
      - desktop-legacy
      - wayland
      - opengl
    environment:
      # python3-tk on core22 (Ubuntu 22.04/jammy) pulls in Tcl/Tk 8.6 -
      # Tkinter can't find its script libraries inside the confined snap
      # without these pointed at the staged copies explicitly.
      TCL_LIBRARY: $SNAP/usr/share/tcltk/tcl8.6
      TK_LIBRARY: $SNAP/usr/share/tcltk/tk8.6
      # Baked in rather than left to the user - this snap only exists for
      # kiosk deployment, unlike a plain `pip install` from source.
      EBC_KIOSK: "1"

parts:
  battery-tester-kiosk:
    # The `python` plugin is a known-bad fit for Tkinter apps (segfaults,
    # missing fontconfig - see the snapcraft forum thread "Tkinter doesn't
    # work with the python plugin"). Dumping the source directly and
    # pulling Tkinter/pyserial from apt (stage-packages), same as this
    # project's old install.sh did, avoids that whole class of problem -
    # this app has no setup.py/pyproject.toml to give the python plugin
    # anything to build anyway.
    plugin: dump
    source: .
    stage-packages:
      # python3 alone still wasn't enough - it's Debian's thin symlink/
      # meta package pointing at python3.10, and across 3 failed builds
      # the real python3.10 interpreter package was never actually in the
      # staged list. That leaves usr/bin/python3 (this app's own command:
      # target) a dangling symlink, which is exactly what "snap is
      # unusable due to missing files" was complaining about each time.
      # Staging the concrete versioned package removes the ambiguity.
      - python3
      - python3.10
      - python3-tk
      - python3-serial
      - fontconfig-config
      - fonts-dejavu-extra
    prime:
      - -.git
      - -.github
      - -deploy
      - -docs
      - -snap
      - -requirements.txt
      - -README.md
