name: Release

on:
  push:
    tags:
      - "v*"

# All 4 jobs create/update a GitHub release (softprops/action-gh-release) -
# needs contents: write explicitly, since GitHub now defaults new repos'
# GITHUB_TOKEN to read-only ("Resource not accessible by integration"
# otherwise).
permissions:
  contents: write

jobs:
  # Plain source tarball - for anyone who'd rather `pip install -r
  # requirements.txt` and run from source. Runs first; the packaged-build
  # jobs below depend on it so only one job ever creates the GitHub
  # release (avoids a race between concurrent `action-gh-release` calls),
  # the rest just append their own asset to it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deployment package
        run: bash deploy/build-package.sh "$GITHUB_REF_NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  # Linux (including 64-bit Raspberry Pi) - a Flatpak for each of
  # x86_64/aarch64. aarch64 is QEMU-emulated on the amd64 runner; fail-fast
  # is off so one flaky arch doesn't take the other down with it. Note:
  # the freedesktop runtime only ships x86_64/aarch64 builds, so unlike the
  # old Snap (which also had an armhf build), this doesn't cover the
  # original 32-bit Raspberry Pi Zero - only Pi Zero 2 W and other 64-bit
  # Pis running a 64-bit OS.
  build-flatpak:
    needs: package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Write build info
        run: python3 deploy/write_build_info.py "$GITHUB_REF_NAME"

      # Docker + QEMU setup, needed only for the emulated aarch64 build -
      # see this action's own CI (.github/workflows/flatpak-test.yml
      # upstream) for why the static Docker binary is fetched manually
      # rather than assumed present in this container image.
      - name: Install Docker (for QEMU setup)
        if: ${{ matrix.arch != 'x86_64' }}
        run: |
          curl https://download.docker.com/linux/static/stable/x86_64/docker-26.0.0.tgz --output ./docker.tgz
          tar xzvf docker.tgz
          mv docker/* /usr/bin

      - name: Set up QEMU
        if: ${{ matrix.arch != 'x86_64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.deeja.BatteryTesterKiosk.yml
          bundle: battery-tester-kiosk-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: battery-tester-kiosk-${{ matrix.arch }}.flatpak

  build-windows-exe:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Write build info
        shell: bash
        run: python3 deploy/write_build_info.py "$GITHUB_REF_NAME"

      - name: Build exe
        run: pyinstaller --name battery-tester-kiosk --onefile --windowed --hidden-import=serial.tools.list_ports --icon=assets/icon.ico --add-data "assets/icon.png;assets" main.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/battery-tester-kiosk.exe

  build-macos-app:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Write build info
        run: python3 deploy/write_build_info.py "$GITHUB_REF_NAME"

      - name: Build app
        run: pyinstaller --name battery-tester-kiosk --onefile --windowed --hidden-import=serial.tools.list_ports --icon=assets/icon.icns --add-data "assets/icon.png:assets" main.py

      - name: Force light appearance (Tk doesn't repaint text color for macOS dark mode)
        run: /usr/libexec/PlistBuddy -c "Add :NSRequiresAquaSystemAppearance bool true" dist/battery-tester-kiosk.app/Contents/Info.plist

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent battery-tester-kiosk.app ../battery-tester-kiosk-macos.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: battery-tester-kiosk-macos.zip
